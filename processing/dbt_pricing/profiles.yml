dbt_pricing:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: 'dbt.duckdb'
      #database: memory
      extensions:
        - httpfs
        - aws
        - postgres_scanner
      settings:
        s3_access_key_id: 'minioadmin'
        s3_secret_access_key: 'minioadmin'
        s3_endpoint: 'http://localhost:9000'
        s3_region: 'us-east-1'
        s3_url_style: 'path'
        s3_use_ssl: false